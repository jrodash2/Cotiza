{% extends 'almacen/base.html' %}{% block content %}<div class="container-fluid py-3"><div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-header"><h4 class="mb-0">{{ titulo }}</h4><small>{{ orden.numero_orden }} · {{ orden.cliente }}</small></div><div class="card-body"><form method="post" novalidate>{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}<div class="text-danger small">{{ field.errors }}</div></div>{% endfor %}<button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" href="{{ orden.get_absolute_url }}">Cancelar</a></form></div></div></div></div></div>{% endblock %}
